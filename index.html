<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Orea AI — Your Intelligent Assistant</title>

    <meta name="description"
          content="Meet Orea AI, your intelligent assistant for learning, creativity, coding, and productivity.">

    <style>
        /* =========================
           GLOBAL STYLES
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --background: #080812;
            --surface: #11111f;
            --primary: #9b5cff;
            --secondary: #42d9ff;
            --text: #ffffff;
            --muted: #a5a5bd;
            --border: rgba(255, 255, 255, 0.1);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: var(--background);
            color: var(--text);
            line-height: 1.6;
            overflow-x: hidden;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button,
        input {
            font: inherit;
        }

        .container {
            width: min(1120px, 90%);
            margin: auto;
        }

        .gradient-text {
            background: linear-gradient(
                90deg,
                #b38aff,
                #42d9ff
            );
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .section-label {
            color: var(--secondary);
            font-size: 13px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 12px;
        }

        .section-title {
            font-size: clamp(30px, 5vw, 45px);
            line-height: 1.2;
            margin-bottom: 18px;
        }

        .section-description {
            color: var(--muted);
            max-width: 600px;
            margin: 0 auto;
        }

        /* =========================
           NAVIGATION
        ========================= */

        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(8, 8, 18, 0.85);
            backdrop-filter: blur(18px);
            border-bottom: 1px solid var(--border);
        }

        nav {
            min-height: 75px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 25px;
        }

        .logo {
            font-size: 25px;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .logo span {
            color: var(--primary);
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 28px;
            list-style: none;
        }

        .nav-links a {
            color: #c5c5d7;
            font-size: 14px;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: var(--secondary);
        }

        .nav-button,
        .primary-button {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            padding: 12px 20px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(
                110deg,
                var(--primary),
                #685cff
            );
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .nav-button:hover,
        .primary-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(155, 92, 255, 0.3);
        }

        .menu-button {
            display: none;
            background: transparent;
            border: 1px solid var(--border);
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
        }

        /* =========================
           HERO SECTION
        ========================= */

        .hero {
            min-height: 690px;
            display: flex;
            align-items: center;
            position: relative;
            overflow: hidden;
            padding: 90px 0;
        }

        .hero::before {
            content: "";
            position: absolute;
            width: 550px;
            height: 550px;
            top: 40px;
            right: -100px;
            background: rgba(111, 59, 255, 0.16);
            filter: blur(120px);
            border-radius: 50%;
            pointer-events: none;
        }

        .hero-grid {
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            align-items: center;
            gap: 55px;
            position: relative;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            padding: 8px 13px;
            border: 1px solid rgba(155, 92, 255, 0.3);
            background: rgba(155, 92, 255, 0.08);
            color: #d7bfff;
            border-radius: 50px;
            font-size: 12px;
            margin-bottom: 25px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #5dffb0;
            box-shadow: 0 0 12px #5dffb0;
        }

        .hero h1 {
            font-size: clamp(45px, 6vw, 72px);
            line-height: 1.06;
            letter-spacing: -3px;
            margin-bottom: 25px;
        }

        .hero-description {
            max-width: 540px;
            color: var(--muted);
            font-size: 17px;
            margin-bottom: 30px;
        }

        .hero-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        .secondary-button {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            padding: 12px 20px;
            border: 1px solid var(--border);
            border-radius: 10px;
            color: #e1e1ee;
            transition: 0.3s;
        }

        .secondary-button:hover {
            border-color: var(--primary);
            background: rgba(155, 92, 255, 0.08);
        }

        .hero-note {
            color: #85859c;
            font-size: 12px;
        }

        /* =========================
           AI VISUAL
        ========================= */

        .ai-visual {
            min-height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .orbit {
            width: 310px;
            height: 310px;
            border: 1px solid rgba(155, 92, 255, 0.35);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: rotate 20s linear infinite;
        }

        .orbit::before,
        .orbit::after {
            content: "";
            position: absolute;
            border: 1px solid rgba(66, 217, 255, 0.18);
            border-radius: 50%;
        }

        .orbit::before {
            width: 240px;
            height: 240px;
        }

        .orbit::after {
            width: 380px;
            height: 380px;
        }

        .ai-core {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: radial-gradient(
                circle at 30% 25%,
                #c8a6ff,
                #7950f2 40%,
                #25205b 75%,
                #0b0b1b
            );
            box-shadow:
                0 0 50px rgba(155, 92, 255, 0.45),
                inset 0 0 25px rgba(255, 255, 255, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 65px;
            position: relative;
            z-index: 2;
            animation: float 4s ease-in-out infinite;
        }

        .floating-tag {
            position: absolute;
            padding: 10px 14px;
            border: 1px solid var(--border);
            background: rgba(17, 17, 31, 0.9);
            border-radius: 10px;
            font-size: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        .tag-one {
            top: 35px;
            right: 0;
        }

        .tag-two {
            bottom: 45px;
            left: 0;
        }

        .tag-three {
            bottom: 15px;
            right: 15px;
        }

        @keyframes rotate {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-12px);
            }
        }

        /* =========================
           FEATURES
        ========================= */

        .features {
            padding: 100px 0;
            border-top: 1px solid var(--border);
            background: linear-gradient(
                180deg,
                #0a0a17,
                #080812
            );
        }

        .section-heading {
            text-align: center;
            margin-bottom: 55px;
        }

        .feature-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 22px;
        }

        .feature-card {
            background: rgba(255, 255, 255, 0.025);
            border: 1px solid var(--border);
            padding: 30px;
            border-radius: 18px;
            transition: 0.3s;
        }

        .feature-card:hover {
            transform: translateY(-7px);
            border-color: rgba(155, 92, 255, 0.5);
            background: rgba(155, 92, 255, 0.045);
        }

        .feature-icon {
            width: 52px;
            height: 52px;
            display: grid;
            place-items: center;
            border-radius: 14px;
            font-size: 25px;
            margin-bottom: 22px;
            background: rgba(155, 92, 255, 0.13);
        }

        .feature-card h3 {
            font-size: 19px;
            margin-bottom: 12px;
        }

        .feature-card p {
            color: var(--muted);
            font-size: 14px;
        }

        /* =========================
           ABOUT
        ========================= */

        .about {
            padding: 100px 0;
        }

        .about-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 70px;
            align-items: center;
        }

        .about-text p {
            color: var(--muted);
            margin-bottom: 20px;
        }

        .check-list {
            list-style: none;
            margin-top: 25px;
        }

        .check-list li {
            margin-bottom: 15px;
            color: #d8d8e8;
        }

        .check-list li::before {
            content: "✓";
            color: var(--secondary);
            margin-right: 12px;
            font-weight: bold;
        }

        .about-panel {
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 35px;
            background:
                radial-gradient(
                    circle at top right,
                    rgba(155, 92, 255, 0.14),
                    transparent 60%
                ),
                var(--surface);
        }

        .about-panel h3 {
            font-size: 23px;
            margin-bottom: 25px;
        }

        .progress-item {
            margin-bottom: 25px;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .progress-track {
            height: 6px;
            border-radius: 10px;
            background: #27273a;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            border-radius: 10px;
            background: linear-gradient(
                90deg,
                var(--primary),
                var(--secondary)
            );
        }

        /* =========================
           CHAT DEMO
        ========================= */

        .demo {
            padding: 100px 0;
            background: #0b0b18;
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
        }

        .chat-box {
            max-width: 720px;
            margin: 45px auto 0;
            background: #10101e;
            border: 1px solid var(--border);
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.25);
        }

        .chat-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 18px 22px;
            border-bottom: 1px solid var(--border);
        }

        .chat-avatar {
            width: 40px;
            height: 40px;
            display: grid;
            place-items: center;
            background: linear-gradient(
                135deg,
                var(--primary),
                #5548cf
            );
            border-radius: 12px;
        }

        .chat-header h3 {
            font-size: 15px;
        }

        .chat-header p {
            font-size: 12px;
            color: #7eeab2;
        }

        .chat-messages {
            height: 320px;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            max-width: 85%;
            padding: 13px 16px;
            border-radius: 14px;
            font-size: 14px;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .bot-message {
            align-self: flex-start;
            background: #1b1b30;
            color: #e2e2f0;
            border-bottom-left-radius: 4px;
        }

        .user-message {
            align-self: flex-end;
            background: linear-gradient(
                120deg,
                #8054ed,
                #5e55d9
            );
            color: white;
            border-bottom-right-radius: 4px;
        }

        .chat-form {
            display: flex;
            gap: 10px;
            padding: 18px;
            border-top: 1px solid var(--border);
        }

        .chat-form input {
            flex: 1;
            min-width: 0;
            background: #19192a;
            border: 1px solid var(--border);
            outline: none;
            color: white;
            padding: 14px;
            border-radius: 10px;
        }

        .chat-form input:focus {
            border-color: var(--primary);
        }

        .chat-form button {
            padding: 0 18px;
        }

        .demo-note {
            text-align: center;
            color: #77778e;
            font-size: 12px;
            margin-top: 18px;
        }

        /* =========================
           CALL TO ACTION
        ========================= */

        .cta {
            padding: 100px 0;
        }

        .cta-panel {
            text-align: center;
            padding: 65px 25px;
            border: 1px solid rgba(155, 92, 255, 0.3);
            border-radius: 25px;
            background:
                radial-gradient(
                    circle at top,
                    rgba(155, 92, 255, 0.17),
                    transparent 70%
                ),
                #10101e;
        }

        .cta-panel h2 {
            font-size: clamp(30px, 5vw, 48px);
            line-height: 1.2;
            margin-bottom: 20px;
        }

        .cta-panel p {
            max-width: 560px;
            margin: 0 auto 28px;
            color: var(--muted);
        }

        /* =========================
           FOOTER
        ========================= */

        footer {
            border-top: 1px solid var(--border);
            padding: 30px 0;
        }

        .footer-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;
        }

        .footer-content p {
            color: #88889f;
            font-size: 12px;
        }

        .footer-links {
            display: flex;
            gap: 20px;
            color: #aaaac0;
            font-size: 12px;
        }

        .footer-links a:hover {
            color: var(--secondary);
        }

        /* =========================
           MOBILE RESPONSIVENESS
        ========================= */

        @media (max-width: 850px) {
            .hero-grid,
            .about-grid {
                grid-template-columns: 1fr;
            }

            .hero {
                padding: 75px 0 45px;
            }

            .hero-content {
                text-align: center;
            }

            .hero-description {
                margin-left: auto;
                margin-right: auto;
            }

            .hero-buttons {
                justify-content: center;
            }

            .ai-visual {
                min-height: 390px;
            }

            .feature-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .about-grid {
                gap: 40px;
            }
        }

        @media (max-width: 600px) {
            .menu-button {
                display: block;
            }

            .nav-links {
                display: none;
                position: absolute;
                top: 75px;
                left: 0;
                right: 0;
                padding: 22px 5%;
                flex-direction: column;
                align-items: stretch;
                gap: 20px;
                background: #10101e;
                border-bottom: 1px solid var(--border);
            }

            .nav-links.open {
                display: flex;
            }

            .nav-button {
                text-align: center;
            }

            .hero h1 {
                letter-spacing: -2px;
            }

            .feature-grid {
                grid-template-columns: 1fr;
            }

            .orbit {
                width: 230px;
                height: 230px;
            }

            .orbit::before {
                width: 180px;
                height: 180px;
            }

            .orbit::after {
                width: 285px;
                height: 285px;
            }

            .ai-core {
                width: 135px;
                height: 135px;
                font-size: 50px;
            }

            .floating-tag {
                font-size: 10px;
                padding: 8px 10px;
            }

            .tag-one {
                right: 0;
                top: 40px;
            }

            .tag-two {
                left: 0;
                bottom: 40px;
            }

            .chat-messages {
                height: 300px;
                padding: 16px;
            }

            .chat-form {
                padding: 12px;
            }

            .chat-form input {
                padding: 12px 10px;
            }

            .chat-form button {
                padding: 0 12px;
            }

            .footer-content {
                flex-direction: column;
                text-align: center;
            }

            .footer-links {
                flex-wrap: wrap;
                justify-content: center;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::be
